name: sequence_wf_with_4_jobs
on: 
 schedule:
  - cron: "5 * * * *"
jobs:     
  job1:    
   name: job1
   runs-on: ubuntu-latest 
   steps:    #steps being a list defined by (-)
      - name: Running single command in job1
        run: echo "This is my first GitHub workflows"
      - name: "Checking OS Release for GitHub hosted Runner"
        run: cat /etc/os-release

  job2:    # name of the job
        name: job2
        runs-on: ubuntu-latest       
        steps:
        - name: checking the hostname for runners
          run: hostname
        - name: running multiple commands
          run: |
           echo "Hi am Vijaya Aiella"
           echo "current time and Date"
        - name: calling sleep
          run:  sleep 20


  job3:    
   name: job3
   needs: job1
   runs-on: windows-latest 
   steps:
     - name: job with single dependency
       run: sleep 10
     - name: checking Runner info
       shell: pwsh  # By default it will be executed Bash cmd
       run: get-computerInfo
  job4:    
   name: job4
   needs: [job1,job2,job3]
   runs-on: MacOS-latest 
   steps:
     - name: job with multiple dependency
       run: sleep 10
     - name: checking Runner info
       run: sw_vers
