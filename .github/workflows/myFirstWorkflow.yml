on:
  push:
   branches:
    - dev
    - feature-*
    - main
  pull_request: 
    branches:
      - main
jobs:     
  job1:    
     name: job1
     runs-on: ubuntu-latest 
     steps:
      - name: step 1
        run: |
         pwd
         ls -ltrc
         hostname
      - name: step 2 - checkout
        uses: actions/checkout@v5.0.0
      - name: step 3
        run: |
         echo pwd >> myartifact.txt
         ls -ltrc
         hostname
      - name: Upload single file
        uses: actions/upload-artifact@v4
        with:
            name: single_file
            path: ./myartifact.txt
